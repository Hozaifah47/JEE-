<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Polymers - JEE Main PYQ Analysis</title>

<style>
:root {
  --bg-main: #0d0d11;
  --bg-card: #18181c;
  --bg-card-hover: #1f1f24;
  --border-color: #27272e;
  --text-primary: #f4f4f5;
  --text-secondary: #a1a1aa;
  --text-muted: #71717a;
  --accent-blue: #2563eb;
  --accent-blue-hover: #1d4ed8;
  --accent-green: #22c55e;
  --accent-red: #ef4444;
  --opt-bg: #1e1e24;
  --opt-border: #2e2e38;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background-color: var(--bg-main);
  color: var(--text-primary);
  line-height: 1.6;
  padding: 24px 16px;
}

.container {
  max-width: 920px;
  margin: 0 auto;
}

.nav-bar {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 24px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border-color);
  font-size: 0.9rem;
}
.nav-bar a {
  color: var(--text-secondary);
  text-decoration: none;
  transition: color 0.2s;
}
.nav-bar a:hover {
  color: var(--accent-blue);
}

.cluster-header {
  margin-bottom: 28px;
}
.cluster-title {
  font-size: 1.6rem;
  font-weight: 700;
  color: #fff;
  margin-bottom: 8px;
}
.cluster-meta {
  display: flex;
  gap: 12px;
  color: var(--text-muted);
  font-size: 0.88rem;
}

/* Question Card */
.q-card {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 12px;
  padding: 24px;
  margin-bottom: 28px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
}

.q-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 18px;
}
.q-header-left {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.q-badge {
  background: #272730;
  color: #fff;
  font-weight: 700;
  font-size: 0.85rem;
  padding: 4px 10px;
  border-radius: 6px;
  min-width: 28px;
  text-align: center;
}

.exam-pill {
  color: var(--text-secondary);
  font-size: 0.85rem;
  font-weight: 500;
}

.type-pill {
  background: #22222a;
  color: var(--text-secondary);
  font-size: 0.75rem;
  padding: 3px 8px;
  border-radius: 4px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.badge-pos {
  color: var(--accent-green);
  font-weight: 700;
}
.badge-neg {
  color: var(--accent-red);
  font-weight: 700;
}

.q-header-right {
  display: flex;
  gap: 12px;
  color: var(--text-muted);
  font-size: 1rem;
}

.q-text {
  font-size: 1.05rem;
  color: #e4e4e7;
  margin-bottom: 20px;
  line-height: 1.7;
}
.q-media { margin: 16px 0 20px; text-align: center; }
.q-media img { max-width: 100%; max-height: 520px; border: 1px solid var(--border-color); border-radius: 8px; background: #fff; }

/* Options */
.options-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 22px;
}

.opt-card {
  display: flex;
  align-items: center;
  gap: 14px;
  background: var(--opt-bg);
  border: 1px solid var(--opt-border);
  border-radius: 8px;
  padding: 12px 16px;
  cursor: pointer;
  transition: all 0.2s ease;
  user-select: none;
}
.opt-card:hover {
  background: var(--bg-card-hover);
  border-color: #3f3f4e;
}
.opt-card.selected {
  border-color: var(--accent-blue);
  background: rgba(37, 99, 235, 0.12);
}
.opt-card.correct {
  border-color: var(--accent-green) !important;
  background: rgba(34, 197, 94, 0.15) !important;
}
.opt-card.incorrect {
  border-color: var(--accent-red) !important;
  background: rgba(239, 68, 68, 0.15) !important;
}

.opt-letter {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 26px;
  height: 26px;
  background: #272732;
  color: var(--text-secondary);
  border-radius: 5px;
  font-size: 0.85rem;
  font-weight: 600;
  flex-shrink: 0;
}
.opt-card.selected .opt-letter {
  background: var(--accent-blue);
  color: #fff;
}
.opt-card.correct .opt-letter {
  background: var(--accent-green);
  color: #fff;
}
.opt-card.incorrect .opt-letter {
  background: var(--accent-red);
  color: #fff;
}

.opt-text {
  font-size: 0.95rem;
  color: var(--text-primary);
}

/* Integer Input */
.int-box {
  margin-bottom: 20px;
}
.int-input {
  background: var(--opt-bg);
  border: 1px solid var(--opt-border);
  color: #fff;
  font-size: 1rem;
  padding: 12px 16px;
  border-radius: 8px;
  width: 100%;
  max-width: 320px;
  outline: none;
}
.int-input:focus {
  border-color: var(--accent-blue);
}

/* Action Button */
.btn-check {
  background: var(--accent-blue);
  color: #fff;
  border: none;
  font-size: 0.95rem;
  font-weight: 600;
  padding: 10px 22px;
  border-radius: 7px;
  cursor: pointer;
  transition: background 0.2s;
}
.btn-check:hover {
  background: var(--accent-blue-hover);
}

/* Feedback Box */
.ans-box {
  display: none;
  margin-top: 18px;
  padding: 14px 18px;
  border-radius: 8px;
  background: #14231b;
  border: 1px solid #1e3a29;
}
.ans-title {
  font-weight: 700;
  color: var(--accent-green);
  font-size: 1rem;
  display: flex;
  align-items: center;
  gap: 8px;
}
.ans-detail {
  margin-top: 6px;
  color: var(--text-secondary);
  font-size: 0.9rem;
}

/* Truth Table in Options */
.tt-table {
  border-collapse: collapse;
  margin: 6px 0;
  font-size: 0.82rem;
  font-family: var(--font-mono, monospace);
  background: #1c1c24;
  border-radius: 6px;
  overflow: hidden;
  border: 1px solid #333342;
}
.tt-table th {
  background: #272734;
  color: #fff;
  padding: 4px 10px;
  border: 1px solid #333342;
  font-weight: 700;
}
.tt-table td {
  padding: 3px 10px;
  border: 1px solid #2a2a38;
  text-align: center;
  color: #e0e0e8;
}
.tt-table td.tt-out {
  font-weight: 700;
  color: #38bdf8;
}
a:focus-visible, button:focus-visible, [role="button"]:focus-visible, input:focus-visible {
  outline: 3px solid var(--accent-blue);
  outline-offset: 3px;
}
</style>

<script>
window.MathJax = {
  tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
  svg: { fontCache: 'global' }
};

var userSelections = {};

function selectOption(qid, opt, correctOpt) {
  var parent = document.getElementById('opts-' + qid);
  if (!parent) return;
  var cards = parent.getElementsByClassName('opt-card');
  for (var i = 0; i < cards.length; i++) {
    cards[i].classList.remove('selected');
  }
  var target = document.getElementById('opt-' + qid + '-' + opt);
  if (target) {
    target.classList.add('selected');
  }
  userSelections[qid] = opt;
}

function checkAnswer(qid, correctAns, qtype) {
  var ansBox = document.getElementById('ans-' + qid);
  if (ansBox) {
    ansBox.style.display = 'block';
  }
  
  if (qtype === 'MCQ') {
    var userOpt = userSelections[qid];
    var parent = document.getElementById('opts-' + qid);
    if (!parent) return;
    
    // Clean correct option to letter (e.g. "Option A" -> "A" or "1" -> "A")
    var cleanCorrect = correctAns.replace(/[^A-Za-z0-9]/g, '').toUpperCase();
    var mapNum = {"1":"A", "2":"B", "3":"C", "4":"D"};
    if (mapNum[cleanCorrect]) cleanCorrect = mapNum[cleanCorrect];
    if (cleanCorrect.startsWith('OPTION')) cleanCorrect = cleanCorrect.replace('OPTION', '');
    cleanCorrect = cleanCorrect.charAt(0);
    
    var correctCard = document.getElementById('opt-' + qid + '-' + cleanCorrect);
    if (correctCard) {
      correctCard.classList.add('correct');
    }
    
    if (userOpt && userOpt !== cleanCorrect) {
      var userCard = document.getElementById('opt-' + qid + '-' + userOpt);
      if (userCard) {
        userCard.classList.add('incorrect');
      }
      var statusEl = document.getElementById('status-' + qid);
      if (statusEl) {
        statusEl.innerHTML = '<span style="color:var(--accent-red)">✕ Incorrect.</span> Correct Answer: Option ' + cleanCorrect;
      }
    } else if (userOpt === cleanCorrect) {
      var statusEl = document.getElementById('status-' + qid);
      if (statusEl) {
        statusEl.innerHTML = '<span style="color:var(--accent-green)">✓ Correct!</span> Option ' + cleanCorrect;
      }
    } else {
      var statusEl = document.getElementById('status-' + qid);
      if (statusEl) {
        statusEl.innerHTML = 'Correct Answer: Option ' + cleanCorrect;
      }
    }
  } else {
    var inp = document.getElementById('inp-' + qid);
    var val = inp ? inp.value.trim() : '';
    var statusEl = document.getElementById('status-' + qid);
    if (val === correctAns.trim()) {
      if (statusEl) statusEl.innerHTML = '<span style="color:var(--accent-green)">✓ Correct!</span> Numerical Value: ' + correctAns;
    } else if (val) {
      if (statusEl) statusEl.innerHTML = '<span style="color:var(--accent-red)">✕ Incorrect.</span> Correct Numerical Value: ' + correctAns;
    } else {
      if (statusEl) statusEl.innerHTML = 'Correct Numerical Value: ' + correctAns;
    }
  }
}

document.addEventListener('click', function(event) {
  var option = event.target.closest('.opt-card[data-qid]');
  if (option) {
    selectOption(option.dataset.qid, option.dataset.option, option.dataset.correct);
    return;
  }
  var check = event.target.closest('.btn-check[data-qid]');
  if (check) {
    checkAnswer(check.dataset.qid, check.dataset.answer, check.dataset.type);
  }
});
document.addEventListener('keydown', function(event) {
  if ((event.key === 'Enter' || event.key === ' ') && event.target.matches('.opt-card[data-qid]')) {
    event.preventDefault();
    selectOption(event.target.dataset.qid, event.target.dataset.option, event.target.dataset.correct);
  }
});
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" defer></script>

</head>
