name: Build JEE portal

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF tooling
        run: python -m pip install --upgrade pymupdf

      - name: Refresh source media metadata
        run: python JEE_MAIN_PYQ_ANALYSIS/07_SCRIPTS/extract_question_media.py

      - name: Rebuild portal
        run: python JEE_MAIN_PYQ_ANALYSIS/07_SCRIPTS/build_everything_clean.py

      - name: Rebuild practice sets
        run: python JEE_MAIN_PYQ_ANALYSIS/07_SCRIPTS/generate_practice_sets.py

      - name: Validate Python sources
        run: python -m py_compile JEE_MAIN_PYQ_ANALYSIS/07_SCRIPTS/*.py
